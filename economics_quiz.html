<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الاقتصاد - السياسة المالية والنقدية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2236;
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --gold: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #1e2d45;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(6,182,212,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 16px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeDown 0.6s ease;
  }

  .header .badge {
    display: inline-block;
    background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(6,182,212,0.2));
    border: 1px solid rgba(59,130,246,0.3);
    color: var(--accent2);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 16px;
    border-radius: 20px;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }

  .header h1 {
    font-family: 'Tajawal', sans-serif;
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 800;
    background: linear-gradient(135deg, var(--text), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .header p {
    color: var(--text-muted);
    font-size: 14px;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .stat-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
  }

  .stat-chip .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  .dot-blue { background: var(--accent); }
  .dot-gold { background: var(--gold); }
  .dot-green { background: var(--green); }
  .dot-red { background: var(--red); }

  /* Section tabs */
  .section-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px;
  }

  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text-muted);
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
  }

  .tab-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
  }

  /* Progress */
  .progress-wrap {
    margin-bottom: 24px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .progress-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 10px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 10px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }

  /* Question card */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 18px;
    animation: slideUp 0.35s ease;
    transition: border-color 0.3s;
  }

  .question-card.answered-correct {
    border-color: rgba(16,185,129,0.4);
    background: linear-gradient(135deg, var(--surface), rgba(16,185,129,0.04));
  }

  .question-card.answered-wrong {
    border-color: rgba(239,68,68,0.4);
    background: linear-gradient(135deg, var(--surface), rgba(239,68,68,0.04));
  }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 22px;
  }

  .q-number {
    min-width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .q-type-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 6px;
    margin-bottom: 6px;
    display: inline-block;
  }

  .badge-tf {
    background: rgba(245,158,11,0.15);
    color: var(--gold);
    border: 1px solid rgba(245,158,11,0.25);
  }

  .badge-mc {
    background: rgba(59,130,246,0.15);
    color: var(--accent);
    border: 1px solid rgba(59,130,246,0.25);
  }

  .q-text {
    font-size: 16px;
    line-height: 1.7;
    font-weight: 600;
  }

  /* True/False buttons */
  .tf-buttons {
    display: flex;
    gap: 10px;
  }

  .tf-btn {
    flex: 1;
    padding: 14px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--surface2);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .tf-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(59,130,246,0.08);
    transform: translateY(-1px);
  }

  .tf-btn:disabled { cursor: default; }

  .tf-btn.selected-correct {
    border-color: var(--green);
    background: rgba(16,185,129,0.12);
    color: var(--green);
  }

  .tf-btn.selected-wrong {
    border-color: var(--red);
    background: rgba(239,68,68,0.12);
    color: var(--red);
  }

  .tf-btn.reveal-correct {
    border-color: var(--green);
    background: rgba(16,185,129,0.08);
    color: var(--green);
  }

  /* MCQ options */
  .mc-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .mc-option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--surface2);
    cursor: pointer;
    transition: all 0.2s;
    text-align: right;
  }

  .mc-option:hover:not(.disabled) {
    border-color: var(--accent);
    background: rgba(59,130,246,0.06);
    transform: translateX(-2px);
  }

  .mc-option.disabled { cursor: default; }

  .mc-option.selected-correct {
    border-color: var(--green);
    background: rgba(16,185,129,0.1);
  }

  .mc-option.selected-wrong {
    border-color: var(--red);
    background: rgba(239,68,68,0.1);
  }

  .mc-option.reveal-correct {
    border-color: var(--green);
    background: rgba(16,185,129,0.06);
  }

  .option-letter {
    min-width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    border: 1px solid var(--border);
    transition: all 0.2s;
  }

  .selected-correct .option-letter { background: rgba(16,185,129,0.3); border-color: var(--green); }
  .selected-wrong .option-letter { background: rgba(239,68,68,0.3); border-color: var(--red); }
  .reveal-correct .option-letter { background: rgba(16,185,129,0.2); border-color: var(--green); }

  .option-text {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
    line-height: 1.5;
  }

  /* Feedback */
  .feedback {
    margin-top: 16px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.7;
    font-weight: 500;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .feedback.show { display: block; }

  .feedback.correct {
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.25);
    color: #6ee7b7;
  }

  .feedback.wrong {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.25);
    color: #fca5a5;
  }

  .feedback-icon {
    font-size: 16px;
    margin-left: 6px;
  }

  /* Results screen */
  .results-screen {
    display: none;
    text-align: center;
    animation: slideUp 0.5s ease;
  }

  .results-screen.show { display: block; }

  .results-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: conic-gradient(var(--green) var(--pct), var(--surface2) 0);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    position: relative;
  }

  .results-circle::before {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background: var(--surface);
  }

  .results-score {
    position: relative;
    z-index: 1;
    font-family: 'Tajawal', sans-serif;
    font-size: 28px;
    font-weight: 800;
  }

  .results-title {
    font-family: 'Tajawal', sans-serif;
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .results-sub {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }

  .result-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 12px;
  }

  .result-box .num {
    font-size: 28px;
    font-weight: 800;
    font-family: 'Tajawal', sans-serif;
    margin-bottom: 4px;
  }

  .result-box .lbl {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .num-green { color: var(--green); }
  .num-red { color: var(--red); }
  .num-blue { color: var(--accent); }

  /* Buttons */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    border-radius: 14px;
    padding: 14px 28px;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin: 6px;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(59,130,246,0.35);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 28px;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin: 6px;
  }

  .btn-secondary:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  /* Navigation */
  .nav-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Trophy animation */
  .trophy-anim {
    font-size: 60px;
    margin-bottom: 16px;
    animation: bounce 1s infinite alternate;
  }

  @keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-8px); }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Responsive */
  @media (max-width: 480px) {
    .results-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .question-card { padding: 20px 16px; }
    .q-text { font-size: 14px; }
    .tf-buttons { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="badge">📚 مراجعة اقتصاد</div>
    <h1>السياسة المالية والنقدية</h1>
    <p>اختبر معلوماتك وتحقق من فهمك للمفاهيم الاقتصادية</p>
  </div>

  <!-- Stats bar -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-chip"><span class="dot dot-blue"></span><span id="statTotal">0</span> سؤال</div>
    <div class="stat-chip"><span class="dot dot-green"></span><span id="statCorrect">0</span> صحيح</div>
    <div class="stat-chip"><span class="dot dot-red"></span><span id="statWrong">0</span> خطأ</div>
    <div class="stat-chip"><span class="dot dot-gold"></span><span id="statPct">0%</span> نتيجة</div>
  </div>

  <!-- Section Tabs -->
  <div class="section-tabs" id="sectionTabs">
    <button class="tab-btn active" onclick="switchSection(0)">صح أم خطأ (28)</button>
    <button class="tab-btn" onclick="switchSection(1)">اختيار من متعدد (25)</button>
    <button class="tab-btn" onclick="switchSection(2)">الكل (53)</button>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-info">
      <span id="progressText">السؤال 1 من 0</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <!-- Questions Container -->
  <div id="questionsContainer"></div>

  <!-- Navigation -->
  <div class="nav-buttons" id="navButtons">
    <button class="btn-secondary" onclick="prevQuestion()">⟩ السابق</button>
    <button class="btn-primary" onclick="nextQuestion()">التالي ⟨</button>
  </div>

  <!-- Results -->
  <div class="results-screen" id="resultsScreen">
    <div class="trophy-anim" id="trophyEmoji">🏆</div>
    <div class="results-title" id="resultsTitle">أحسنت!</div>
    <div class="results-sub" id="resultsSub">لقد أنهيت الاختبار</div>
    <div class="results-circle" id="resultsCircle" style="--pct: 0deg">
      <div class="results-score" id="resultsScore">0%</div>
    </div>
    <div class="results-grid">
      <div class="result-box">
        <div class="num num-green" id="resCorrect">0</div>
        <div class="lbl">إجابات صحيحة</div>
      </div>
      <div class="result-box">
        <div class="num num-red" id="resWrong">0</div>
        <div class="lbl">إجابات خاطئة</div>
      </div>
      <div class="result-box">
        <div class="num num-blue" id="resTotal">0</div>
        <div class="lbl">إجمالي الأسئلة</div>
      </div>
    </div>
    <div>
      <button class="btn-primary" onclick="restartQuiz()">🔄 إعادة الاختبار</button>
      <button class="btn-secondary" onclick="reviewAnswers()">📋 مراجعة الإجابات</button>
    </div>
  </div>
</div>

<script>
// ==================== QUESTIONS DATA ====================
const tfQuestions = [
  { id: 1, type: 'tf', text: 'السياسة المالية هي مجموعة الإجراءات التي يتخذها البنك المركزي لإدارة النشاط الاقتصادي.', answer: false, explanation: 'السياسة المالية تتخذها الحكومة وليس البنك المركزي.' },
  { id: 2, type: 'tf', text: 'من أهداف السياسة المالية تحقيق التوازن الاجتماعي ورفع مستوى الرفاهية وتحقيق العدالة الاجتماعية.', answer: true, explanation: 'صحيح، هذا من أهم أهداف السياسة المالية.' },
  { id: 3, type: 'tf', text: 'أدوات السياسة المالية تتمثل في الإنفاق الحكومي والضرائب.', answer: true, explanation: 'صحيح، الإنفاق الحكومي والضرائب هما الأداتان الرئيسيتان للسياسة المالية.' },
  { id: 4, type: 'tf', text: 'تهدف السياسة النقدية إلى تحقيق التوازن في الميزان التجاري وميزان المدفوعات وتحسين قيمة العملة.', answer: true, explanation: 'صحيح، هذه من ضمن أهداف السياسة النقدية.' },
  { id: 5, type: 'tf', text: '"سياسة السوق المفتوح" من أدوات السياسة المالية.', answer: false, explanation: 'سياسة السوق المفتوح من أدوات السياسة النقدية وليس المالية.' },
  { id: 6, type: 'tf', text: 'في حالة الركود، تهدف السياسة النقدية إلى تقليل عرض النقود للحد من التضخم.', answer: false, explanation: 'في حالة الركود، تهدف إلى زيادة عرض النقود ليزيد الطلب الفعال ومن ثم زيادة التشغيل.' },
  { id: 7, type: 'tf', text: 'السياسة الانكماشية هي سياسات تتبعها الحكومة والبنك المركزي لحل مشكلة الفجوة التضخمية.', answer: true, explanation: 'صحيح، السياسة الانكماشية تستخدم لمعالجة الفجوة التضخمية.' },
  { id: 8, type: 'tf', text: 'من الإجراءات النقدية الانكماشية قيام البنك المركزي بشراء السندات لضخ السيولة في البنوك.', answer: false, explanation: 'في السياسة الانكماشية يقوم البنك ببيع السندات لامتصاص السيولة الزائدة، وليس شراؤها.' },
  { id: 9, type: 'tf', text: 'في السياسة المالية التوسعية، يتم زيادة الإنفاق الحكومي وتقليل الضرائب للتشجيع على الاستهلاك.', answer: true, explanation: 'صحيح، هذا هو جوهر السياسة المالية التوسعية.' },
  { id: 10, type: 'tf', text: 'ظهرت النقود أولاً ثم جاء بعدها نظام المقايضة لتسهيل التعاملات.', answer: false, explanation: 'ظهر نظام المقايضة أولاً، وأدت صعوباته إلى ظهور النقود.' },
  { id: 11, type: 'tf', text: 'النقود المصرفية (الودائع) تعتبر أحد أنواع النقود المعترف بها.', answer: true, explanation: 'صحيح، الودائع أو النقود المصرفية معترف بها كنوع من أنواع النقود.' },
  { id: 12, type: 'tf', text: 'يُعد البنك المركزي المستشار المالي للحكومة لأنه يحتفظ بودائعها ويسهل تسوية حساباتها.', answer: true, explanation: 'صحيح، هذه من ضمن أدوار البنك المركزي كمستشار مالي.' },
  { id: 13, type: 'tf', text: 'البنوك التجارية هي الجهة الوحيدة التي تتفرد بسلطة إصدار النقد الورقي القانوني للدولة.', answer: false, explanation: 'البنك المركزي هو "بنك الإصدار" الذي يتفرد بهذه السلطة، وليس البنوك التجارية.' },
  { id: 14, type: 'tf', text: 'التضخم الركودي هو مشكلة مزدوجة ومعقدة تجمع بين الارتفاع العالي في الأسعار وارتفاع نسبة البطالة في وقت واحد.', answer: true, explanation: 'صحيح، هذا هو تعريف التضخم الركودي.' },

const allQuestions = [...tfQuestions, ...mcQuestions];

// ==================== STATE ====================
let sections = [tfQuestions, mcQuestions, allQuestions];
let currentSection = 0;
let currentQuestions = [];
let currentIndex = 0;
let answers = {};
let reviewMode = false;

// ==================== INIT ====================
function init() {
  currentQuestions = [...sections[currentSection]];
  currentIndex = 0;
  answers = {};
  reviewMode = false;
  document.getElementById('resultsScreen').classList.remove('show');
  document.getElementById('questionsContainer').style.display = 'block';
  document.getElementById('navButtons').style.display = 'flex';
  document.getElementById('sectionTabs').style.display = 'flex';
  document.getElementById('statsBar').style.display = 'flex';
  renderQuestion();
  updateStats();
}

function switchSection(idx) {
  currentSection = idx;
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  init();
}

// ==================== RENDER ====================
function renderQuestion() {
  const q = currentQuestions[currentIndex];
  const container = document.getElementById('questionsContainer');
  const userAnswer = answers[q.id];
  const answered = userAnswer !== undefined;

  updateProgress();

  let html = `<div class="question-card ${answered ? (isCorrect(q, userAnswer) ? 'answered-correct' : 'answered-wrong') : ''}" id="qCard">`;

  html += `<div class="q-header">
    <div class="q-number">${currentIndex + 1}</div>
    <div>
      <span class="q-type-badge ${q.type === 'tf' ? 'badge-tf' : 'badge-mc'}">${q.type === 'tf' ? '✓ صح أم خطأ' : '● اختيار من متعدد'}</span>
      <div class="q-text">${q.text}</div>
    </div>
  </div>`;

  if (q.type === 'tf') {
    html += `<div class="tf-buttons">`;
    const trueClass = answered ? (userAnswer === true ? (isCorrect(q, true) ? 'selected-correct' : 'selected-wrong') : (q.answer === true ? 'reveal-correct' : '')) : '';
    const falseClass = answered ? (userAnswer === false ? (isCorrect(q, false) ? 'selected-correct' : 'selected-wrong') : (q.answer === false ? 'reveal-correct' : '')) : '';
    html += `<button class="tf-btn ${trueClass}" onclick="answerTF(true)" ${answered ? 'disabled' : ''}>✅ صح</button>`;
    html += `<button class="tf-btn ${falseClass}" onclick="answerTF(false)" ${answered ? 'disabled' : ''}>❌ خطأ</button>`;
    html += `</div>`;
  } else {
    html += `<div class="mc-options">`;
    const letters = ['أ', 'ب', 'ج', 'د'];
    q.options.forEach((opt, i) => {
      let cls = '';
      if (answered) {
        if (userAnswer === i) cls = isCorrect(q, i) ? 'selected-correct' : 'selected-wrong';
        else if (i === q.answer) cls = 'reveal-correct';
        cls += ' disabled';
      }
      html += `<div class="mc-option ${cls}" onclick="${answered ? '' : `answerMC(${i})`}">
        <div class="option-letter">${letters[i]}</div>
        <div class="option-text">${opt}</div>
      </div>`;
    });
    html += `</div>`;
  }

  // Feedback
  if (answered) {
    const correct = isCorrect(q, userAnswer);
    html += `<div class="feedback ${correct ? 'correct' : 'wrong'} show">
      <span class="feedback-icon">${correct ? '✅' : '❌'}</span>
      ${correct ? '<strong>إجابة صحيحة!</strong>' : '<strong>إجابة خاطئة.</strong>'}
      ${q.explanation ? ` — ${q.explanation}` : ''}
    </div>`;
  }

  html += `</div>`;
  container.innerHTML = html;
  container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function isCorrect(q, ans) {
  if (q.type === 'tf') return ans === q.answer;
  return ans === q.answer;
}

// ==================== ANSWER ====================
function answerTF(val) {
  const q = currentQuestions[currentIndex];
  if (answers[q.id] !== undefined) return;
  answers[q.id] = val;
  updateStats();
  renderQuestion();
}

function answerMC(idx) {
  const q = currentQuestions[currentIndex];
  if (answers[q.id] !== undefined) return;
  answers[q.id] = idx;
  updateStats();
  renderQuestion();
}

// ==================== NAVIGATION ====================
function nextQuestion() {
  if (currentIndex < currentQuestions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showResults();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

// ==================== PROGRESS ====================
function updateProgress() {
  const total = currentQuestions.length;
  const done = Object.keys(answers).filter(id => currentQuestions.find(q => q.id == id)).length;
  const pct = total ? Math.round((currentIndex + 1) / total * 100) : 0;
  document.getElementById('progressText').textContent = `السؤال ${currentIndex + 1} من ${total}`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function updateStats() {
  const total = currentQuestions.length;
  const answered = Object.entries(answers).filter(([id]) => currentQuestions.find(q => q.id == id));
  const correct = answered.filter(([id, ans]) => {
    const q = currentQuestions.find(q => q.id == id);
    return q && isCorrect(q, ans);
  }).length;
  const wrong = answered.length - correct;
  const pct = answered.length ? Math.round(correct / answered.length * 100) : 0;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statPct').textContent = pct + '%';
}

// ==================== RESULTS ====================
function showResults() {
  const total = currentQuestions.length;
  const answered = Object.entries(answers).filter(([id]) => currentQuestions.find(q => q.id == id));
  const correct = answered.filter(([id, ans]) => {
    const q = currentQuestions.find(q => q.id == id);
    return q && isCorrect(q, ans);
  }).length;
  const wrong = answered.length - correct;
  const pct = total ? Math.round(correct / total * 100) : 0;
  const deg = pct * 3.6;

  document.getElementById('questionsContainer').style.display = 'none';
  document.getElementById('navButtons').style.display = 'none';
  document.getElementById('resultsScreen').classList.add('show');
  document.getElementById('resultsCircle').style.setProperty('--pct', deg + 'deg');
  document.getElementById('resultsScore').textContent = pct + '%';
  document.getElementById('resCorrect').textContent = correct;
  document.getElementById('resWrong').textContent = wrong;
  document.getElementById('resTotal').textContent = total;

  let title, emoji;
  if (pct >= 90) { title = 'ممتاز! 🌟'; emoji = '🏆'; }
  else if (pct >= 75) { title = 'جيد جداً! 👏'; emoji = '🥇'; }
  else if (pct >= 60) { title = 'جيد، استمر! 💪'; emoji = '🥈'; }
  else { title = 'تحتاج مزيداً من المراجعة'; emoji = '📚'; }

  document.getElementById('resultsTitle').textContent = title;
  document.getElementById('trophyEmoji').textContent = emoji;
  document.getElementById('resultsSub').textContent = `أجبت على ${answered.length} من ${total} سؤال`;
}

function restartQuiz() {
  document.getElementById('resultsScreen').classList.remove('show');
  init();
}

function reviewAnswers() {
  reviewMode = true;
  currentIndex = 0;
  document.getElementById('resultsScreen').classList.remove('show');
  document.getElementById('questionsContainer').style.display = 'block';
  document.getElementById('navButtons').style.display = 'flex';
  renderQuestion();
}

// ==================== START ====================
init();
</script>
